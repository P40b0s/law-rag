[package]
name = "api-service"
version = "0.1.0"
edition = "2024"


[dependencies]
tokio = { version =  "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-util= {version="0.7.16", features = ["io"]}
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_sqlite_jsonb = { version = "0.2.1" }
utilites = { version="*", git="https://github.com/P40b0s/help_utilites.git", package = "utilites", features = ["dates", "http", "hashing", "retry", 'async-io']}
#auth_service = { version="*", git="https://github.com/P40b0s/auth_service.git"}
jwt_authentification = { version="*", git="https://github.com/P40b0s/jwt_authentification.git"}
thiserror="2.0.16"
uuid= {version="1.19.0", features = ["v7", "serde"] }
axum= {version = "0.8.8", features = ["tokio", "json", "query", "multipart"]}
tower = {version = "0.5.3", features = ["full"]}
tower-http= {version = "0.6.8", features = ["cors", "fs", "trace", "limit", "compression-gzip"]}
futures = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
async-stream="0.3.6"
parking_lot.workspace = true
include_dir = "0.7"
mime_guess = "2.0"
flate2 = "1.0"  # Для сжатия статических файлов
once_cell = "1.18"  # Для ленивой инициализации
lazy_static = "1.4"  # Альтернатива once_cell
regex="1.12.2"
if-addrs ="0.14.0"

systema-client = {path = "../systema-client"}
embedding = {path = "../embedding"}
database = {path = "../database"}
rag-service = {path = "../rag-service"}
rag-core = {path = "../rag-core"}
chunks_preparation = {path = "../chunks_preparation"}
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
figment.workspace = true
[dev-dependencies]
tokio-test= {version ="0.4.5"}