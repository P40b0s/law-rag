[package]
name = "law-rag"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["embedding",
    "rag-service","systema-client"
, "database", "api-service", "chunks_preparation", "rag-core"]
default-members = ["api-service"]
[workspace.dependencies]
candle-core = {git = "https://github.com/huggingface/candle.git", package="candle-core"}
candle-nn = {git = "https://github.com/huggingface/candle.git", package="candle-nn"}
hf-hub = "0.4.3"
candle-transformers = {git = "https://github.com/huggingface/candle.git", package="candle-transformers"}
tokenizers = {version ="0.22.2", features = ["http"]}
scraper = "0.25.0"
html5ever = "0.36.1"
serde = "1.0.228"
serde_json = "1.0.145"
rangemap = "1.7.1"
thiserror = "2.0.17"
anyhow = "*"
sqlx= {version ="0.8.6" , features = ["sqlite", "runtime-tokio"]}
tracing = "0.1.44"
tokio = {version = "1.48.0", features = ["full"]}
futures="0.3.31"
tracing-subscriber = {version = "0.3.22", features = ["std", "fmt", "env-filter"]}
utilites = {git = "https://github.com/P40b0s/help_utilites.git", package = "utilites", features = ["http", "dates"]}
encoding = "0.2.33"
regex = "1.12.2"
qdrant-client = {version = "1.16.0"}
uuid =  {version = "1.20.0", features = ["v4", "v7", "serde"]}
rand="0.9.2"
text-splitter = {git = "https://github.com/benbrandt/text-splitter.git", features = ["tokenizers"]}
figment =  {version = "0.10.19", features = ["toml", "env"]}
tokio-test="0.4.5"
parking_lot = "*"
reqwest = {version = "0.12", features = ["json", "stream"]}
